name: Security Scan (Strix)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  strix-scan:
    name: Autonomous Security Assessment
    runs-on: ubuntu-latest
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for diff-scope resolution

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix Security Scan
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            strix -n -t ./ --scan-mode quick --max-budget 10
          else
            echo "STRIX_LLM or LLM_API_KEY secret is not configured. Skipping active scan."
          fi

      - name: Fail unless the scan completed
        if: env.LLM_API_KEY != ''
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          if [ -n "$run_json" ] && [ -f "$run_json" ]; then
            status=$(jq -r .status "$run_json")
            if [ "$status" != "completed" ]; then
              echo "Strix run status is '$status' — the scan did not complete (likely budget exhausted). Raise --max-budget." >&2
              exit 1
            fi
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: strix_runs
